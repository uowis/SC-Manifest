# Déploiement automatique de Star Manifest vers l'hébergement OVH (SFTP, chiffré), à chaque push sur la branche main.
# Secrets à créer dans le dépôt GitHub (Settings → Secrets and variables → Actions → New repository secret) :
#   OVH_FTP_SERVER    ftp.cluster129.hosting.ovh.net
#   OVH_FTP_USER      identifiant FTP principal (espace client OVH → Hébergement → FTP-SSH)
#   OVH_FTP_PASSWORD  mot de passe FTP
# v3 : plus d'apt-get (les miroirs Ubuntu des runners GitHub sont injoignables) ; envoi en Python (paramiko, via pip).
name: Déploiement OVH

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » pour relancer à la main

concurrency:
  group: deploy-ovh
  cancel-in-progress: true  # un nouveau push annule le déploiement en cours

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer paramiko
        run: python3 -m pip install --quiet --disable-pip-version-check paramiko

      - name: Envoyer les fichiers sur OVH (SFTP, port 22)
        env:
          SERVEUR: ${{ secrets.OVH_FTP_SERVER }}
          UTILISATEUR: ${{ secrets.OVH_FTP_USER }}
          MOTDEPASSE: ${{ secrets.OVH_FTP_PASSWORD }}
        shell: python3 {0}
        run: |
          # Envoie le dépôt vers le dossier www (fichiers nouveaux ou de taille différente, + tous les .html/.js/.css/.htaccess).
          # Pas de suppression côté serveur : un fichier retiré du dépôt reste chez OVH (à effacer à la main si besoin).
          import os, fnmatch, stat, paramiko
          EXCLURE = [".git*", ".github", "github", "workflows", "README.md", "CODEOWNERS", "admins.txt", "deploy-ovh.yml"]
          TOUJOURS = (".html", ".js", ".css", ".htaccess", ".json", ".txt")
          exclu = lambda n: any(fnmatch.fnmatch(n, m) for m in EXCLURE)
          t = paramiko.Transport((os.environ["SERVEUR"], 22)); t.banner_timeout = 60
          t.connect(username=os.environ["UTILISATEUR"], password=os.environ["MOTDEPASSE"])
          sftp = paramiko.SFTPClient.from_transport(t)
          envoyes = 0
          def dossier(d):
              try: sftp.stat(d)
              except IOError: sftp.mkdir(d)
          for racine, dossiers, fichiers in os.walk("."):
              dossiers[:] = [d for d in dossiers if not exclu(d)]
              rel = os.path.relpath(racine, ".")
              distant = "www" if rel == "." else "www/" + rel.replace(os.sep, "/")
              dossier(distant)
              for f in fichiers:
                  if exclu(f): continue
                  loc, dist = os.path.join(racine, f), distant + "/" + f
                  try: identique = sftp.stat(dist).st_size == os.path.getsize(loc) and not f.endswith(TOUJOURS)
                  except IOError: identique = False
                  if identique: continue
                  sftp.put(loc, dist); envoyes += 1; print("envoyé", dist)
          sftp.close(); t.close()
          print(f"{envoyes} fichier(s) envoyé(s)")
