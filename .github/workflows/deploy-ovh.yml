# Déploiement automatique de Star Manifest vers l'hébergement OVH (SFTP, chiffré), à chaque push sur la branche main.
# Secrets à créer dans le dépôt GitHub (Settings → Secrets and variables → Actions → New repository secret) :
#   OVH_FTP_SERVER    ftp.cluster129.hosting.ovh.net
#   OVH_FTP_USER      identifiant FTP principal (espace client OVH → Hébergement → FTP-SSH)
#   OVH_FTP_PASSWORD  mot de passe FTP
name: Déploiement OVH

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » pour relancer à la main

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer les fichiers sur OVH (SFTP, port 22)
        env:
          SERVEUR: ${{ secrets.OVH_FTP_SERVER }}
          UTILISATEUR: ${{ secrets.OVH_FTP_USER }}
          MOTDEPASSE: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          # mirror -R : envoie le dépôt vers le dossier www (seulement les fichiers nouveaux ou modifiés).
          # Fichiers du dépôt qui ne doivent PAS être en ligne : admins.txt, CODEOWNERS, workflows.
          # Pas de suppression côté serveur : un fichier retiré du dépôt reste chez OVH (à effacer à la main si besoin).
          lftp -u "$UTILISATEUR,$MOTDEPASSE" -p 22 "sftp://$SERVEUR" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            mirror -R --verbose --exclude-glob .git* --exclude-glob .github/ --exclude-glob github/ --exclude-glob workflows/ --exclude-glob README.md --exclude-glob CODEOWNERS --exclude-glob admins.txt ./ www/;
            quit"
