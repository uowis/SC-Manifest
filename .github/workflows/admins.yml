# Synchronise admins.txt avec la table des administrateurs dans Supabase.
# Secrets à créer dans GitHub : Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_URL          ex. https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE la clé « service_role » (Supabase : Project Settings > API). Ne jamais la mettre dans le code.
name: Administrateurs

on:
  push:
    branches: [main]
    paths: [admins.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envoyer la liste à Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE" ]; then
            echo "::error::Secrets SUPABASE_URL et SUPABASE_SERVICE_ROLE manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          corps=$(sed 's/#.*//' admins.txt | tr -d '[:blank:]' | sed '/^$/d' | jq -R . | jq -s '{p_liste: .}')
          echo "Liste envoyée : $corps"
          reponse=$(curl -sS -w '\n%{http_code}' -X POST "${SUPABASE_URL%/}/rest/v1/rpc/sync_super_admins" \
            -H "apikey: $SUPABASE_SERVICE_ROLE" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE" \
            -H "Content-Type: application/json" \
            -d "$corps")
          code=$(echo "$reponse" | tail -n1); json=$(echo "$reponse" | sed '$d')
          echo "Réponse ($code) : $json"
          if [ "$code" != "200" ]; then echo "::error::Échec de la synchronisation : $json"; exit 1; fi
          introuvables=$(echo "$json" | jq -r '.introuvables | join(", ")')
          if [ -n "$introuvables" ]; then echo "::warning::Identifiants sans compte : $introuvables"; fi
          echo "Administrateurs : $(echo "$json" | jq -r '.admins | join(", ")')"
